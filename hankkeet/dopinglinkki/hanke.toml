tarkistettu = "2026-10-23"

[kriisi]
# Hankekohtaiset lisäsignaalit (säännölliset lausekkeet), yhteisten kriisisignaalien lisäksi.
# Huom. taivutus: "sydän" -> "sydämen", siksi vartalo "syd[äa]n|syd[äa]m".
akuutti_terveysriski = [
  "rintakip\\w*",
  "(?:syd[äa]n|syd[äa]m)\\w*\\s*(?:hakkaa|lyö|tykyt\\w*|tykytt\\w*|rytmihäiriö\\w*|pysäh\\w*)",
  "tykytys\\w*|tykyttel\\w*",
  "rytmihäiriö\\w*",
  "(?:lepo)?syke\\w*\\D{0,15}(?:1[1-9]\\d|[2-9]\\d\\d)",
  "(?:pistos|piikki)\\w* .{0,40}(?:turvo\\w*|punoitt\\w*|kuum\\w*|märk\\w*|paise\\w*)",
  "paise\\w*",
  "korkea kuume",
  "ylikuume\\w*",
  "verensokeri\\w* .{0,20}(?:alhaal\\w*|matal\\w*|laski\\w*)",
  "hengenahdistu\\w*",
  "pyörty\\w*|tajun(?:nan)? menetys",
  "puutu\\w* .{0,20}(?:käsi|jalka|kasvo\\w*)",
]
