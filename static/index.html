<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vastausapuri</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #5f5e5a; --line: #dddbd4;
    --accent: #1f5fa8; --accent-soft: #e6eef8; --warn: #9a3412; --warn-soft: #fdeee6;
    --mid: #8a5a00; --mid-soft: #fbf1dc; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --panel: #222225; --ink: #ecebe7; --muted: #a3a29c; --line: #3a3a3e;
      --accent: #7fb0ea; --accent-soft: #1f2d3e; --warn: #f2a37a; --warn-soft: #3a241a;
      --mid: #e5c07b; --mid-soft: #33291a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex;
    justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header small { color: var(--muted); }
  header a { color: inherit; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 24px;
    padding: 24px; max-width: 1360px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 8px; }
  textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; }
  #q { min-height: 260px; resize: vertical; }
  #draft { min-height: 360px; resize: vertical; line-height: 1.55; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .controls label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: var(--bg); color: var(--ink); padding: 9px 8px; }
  .seg button.on { background: var(--accent); color: #fff; }
  button { font: inherit; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 12px 16px;
    margin-bottom: 16px; font-weight: 600; }
  .banner span { font-weight: 400; display: block; }
  .issue { border-left: 3px solid var(--line); padding: 6px 12px; margin-bottom: 8px; font-size: 14px; }
  .issue.korkea { border-color: var(--warn); background: var(--warn-soft); }
  .issue.keski { border-color: var(--mid); background: var(--mid-soft); }
  .issue q { color: var(--muted); font-style: italic; }
  .link { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .link.kriisi { border-color: var(--warn); }
  .link input { margin-top: 4px; }
  .link a { color: var(--accent); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .link .meta { grid-column: 2; color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent); margin: 0 6px 4px 0; }
  ol, ul { margin: 0; padding-left: 20px; }
  pre { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; font-size: 13px;
    border: 1px solid var(--line); margin: 0; }
  details { margin-top: 16px; } summary { cursor: pointer; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
  .err { color: var(--warn); }
  .progress { padding: 8px 0; }
  .progress h2 { display: flex; align-items: center; gap: 10px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line);
    border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .steps { list-style: none; padding: 0; margin: 12px 0 0; }
  .steps li { display: flex; align-items: center; gap: 10px; padding: 6px 0; color: var(--muted); }
  .steps li .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none;
    display: grid; place-items: center; font-size: 11px; line-height: 1; }
  .steps li.active { color: var(--ink); font-weight: 600; }
  .steps li.active .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .steps li.done .dot { border-color: var(--accent); background: var(--accent); color: #fff; }
  .steps li .t { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Vastausapuri</h1>
  <small><span id="status">…</span> · <a href="/logout">Kirjaudu ulos</a></small>
</header>
<main>
  <section>
    <div class="controls">
      <div><label for="hanke">Palvelu</label><select id="hanke"></select></div>
      <div><label>Tila</label>
        <div class="seg" id="mode">
          <button type="button" data-mode="luonnos" class="on">Luonnos</button>
          <button type="button" data-mode="linkit">Vain linkit</button>
        </div>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="own"> <span id="ownLabel">Kirjoita minun tyylilläni</span></label>
    <label class="check"><input type="checkbox" id="research" checked> <span id="researchLabel">Hae tutkimustietoa (Europe PMC)</span></label>
    <details id="threadBox" style="margin-top:16px">
      <summary>Jatkokysymys? Liitä aiempi keskustelu</summary>
      <textarea id="thread" style="min-height:160px;margin-top:8px" placeholder="Liitä tähän alkuperäinen kysymys ja siihen annettu vastaus (ja mahdolliset aiemmat jatkokysymykset). Kirjoita itse jatkokysymys alla olevaan kenttään."></textarea>
    </details>
    <h2 style="margin-top:16px" id="qTitle">Kysymys</h2>
    <textarea id="q" placeholder="Liitä kysyjän viesti tähän. Nimet ja yhteystiedot korvataan paikkamerkeillä ennen kuin teksti lähtee mallille."></textarea>
    <div class="row">
      <button id="go">Tee luonnos</button>
      <span class="hint">Ctrl + Enter</span>
    </div>
    <p class="hint">Apuri ei tallenna kysymystä. Vastaus lähtee aina vastaajalta itseltään.</p>
  </section>
  <section id="out"><p class="empty">Luonnos ja ehdotukset näkyvät tässä.</p></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SIGNAL = {itsetuhoisuus: "itsetuhoisuus", "väkivalta": "väkivalta", lapsen_turvallisuus: "lapsen turvallisuus",
  akuutti_myrkytys: "akuutti myrkytys", akuutti_terveysriski: "akuutti terveysriski"};
const SOURCE = {luonnostelija: "luonnostelija", tarkastaja: "lisätty tarkastuksessa", "kriisi-automaatti": "kriisisignaali"};
let state = {mode: "luonnos", status: null};

function store(k, v) { try { v === undefined ? null : localStorage.setItem(k, v); return localStorage.getItem(k); } catch { return null; } }

fetch("/api/status").then(r => r.json()).then(s => {
  state.status = s;
  $("#status").textContent = `${s.user ? s.user + " · " : ""}${s.provider} · ${s.drafter.replace(/^eu\.anthropic\./, "")} + ${s.checker.replace(/^eu\.anthropic\./, "")}`;
  $("#hanke").innerHTML = s.hankkeet.map(h => `<option value="${esc(h.id)}">${esc(h.nimi)}</option>`).join("");
  const saved = store("apuri.hanke");
  if (saved && s.hankkeet.some(h => h.id === saved)) $("#hanke").value = saved;
  const m = store("apuri.mode"); if (m) setMode(m);
  refreshOwn();
}).catch(() => $("#status").textContent = "ei yhteyttä");

function refreshOwn() {
  const s = state.status; if (!s) return;
  const h = s.hankkeet.find(x => x.id === $("#hanke").value);
  const has = h && s.user && h.vastaajat.includes(s.user);
  $("#own").disabled = !has || state.mode !== "luonnos";
  if (!has) $("#own").checked = false;
  $("#ownLabel").textContent = has ? "Kirjoita minun tyylilläni"
    : "Kirjoita minun tyylilläni (ei käytössä: omia vastauksia ei ole indeksissä)";
  const res = s.research === "europepmc" && h && h.tutkimus;
  $("#research").disabled = !res || state.mode !== "luonnos";
  if (!res) $("#research").checked = false;
  $("#researchLabel").textContent = res ? "Hae tutkimustietoa (Europe PMC)" : "Hae tutkimustietoa (ei käytössä tässä ympäristössä)";
}
function setMode(m) {
  state.mode = m; store("apuri.mode", m);
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#go").textContent = m === "luonnos" ? "Tee luonnos" : "Hae linkit";
  refreshOwn();
}
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
$("#hanke").onchange = () => { store("apuri.hanke", $("#hanke").value); refreshOwn(); };

function showProgress(steps) {
  state.steps = steps.map(x => ({...x, state: "wait", t0: null, t1: null}));
  state.started = performance.now();
  $("#out").innerHTML = `<div class="progress" role="status" aria-live="polite">
    <h2><span class="spinner"></span><span>${state.mode === "luonnos" ? "Luonnosta tehdään" : "Ehdotuksia haetaan"}</span>
      <span class="hint" id="elapsed" style="margin-left:auto;font-weight:400">0 s</span></h2>
    <p class="hint">${state.mode === "luonnos" ? "Tavallisesti 20–60 sekuntia." : "Tavallisesti 5–15 sekuntia."} Voit jatkaa muita töitä sillä välin.</p>
    <ol class="steps" id="steps"></ol></div>`;
  drawSteps();
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    const el = $("#elapsed"); if (!el) return clearInterval(state.timer);
    el.textContent = `${Math.round((performance.now() - state.started) / 1000)} s`;
    drawSteps();
  }, 500);
}
function markStep(id) {
  const now = performance.now();
  let reached = false;
  for (const st of state.steps) {
    if (st.id === id) { reached = true; if (st.state !== "active") { st.state = "active"; st.t0 = now; } continue; }
    if (!reached && st.state !== "done") { st.state = "done"; st.t1 = now; st.t0 = st.t0 || now; }
  }
  drawSteps();
}
function drawSteps() {
  const ol = $("#steps"); if (!ol) return;
  const now = performance.now();
  ol.innerHTML = state.steps.map(st => {
    const secs = st.t0 ? Math.max(0, Math.round(((st.t1 || now) - st.t0) / 1000)) : null;
    return `<li class="${st.state}"><span class="dot">${st.state === "done" ? "✓" : ""}</span>${esc(st.label)}
      ${st.state !== "wait" && secs !== null && (st.state === "active" || secs > 0) ? `<span class="t">${secs} s</span>` : ""}</li>`;
  }).join("");
}

async function run() {
  const q = $("#q").value.trim();
  if (q.length < 5 || !$("#hanke").value) return;
  $("#go").disabled = true;
  showProgress([{id: "suojaus", label: "Poistetaan tunnistetiedot"}]);
  const payload = {question: q, hanke: $("#hanke").value, mode: state.mode, own_style: $("#own").checked,
    thread: $("#thread").value.trim() || null, research: $("#research").checked};
  try {
    const r = await fetch("/api/suggest/stream", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)});
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || r.status); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", done = false, result = null;
    while (!done) {
      const chunk = await reader.read();
      done = chunk.done;
      buf += dec.decode(chunk.value || new Uint8Array(), {stream: !done});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "steps") showProgress(ev.steps);
        else if (ev.type === "step") markStep(ev.id);
        else if (ev.type === "error") throw new Error(ev.detail);
        else if (ev.type === "result") result = ev.data;
      }
    }
    if (!result) throw new Error("Yhteys katkesi ennen kuin luonnos valmistui. Yritä uudelleen.");
    clearInterval(state.timer);
    render(result);
  } catch (e) {
    clearInterval(state.timer);
    $("#out").innerHTML = `<p class="err">Virhe: ${esc(e.message)}</p>`;
  } finally { $("#go").disabled = false; }
}

async function copy(text, el) {
  try { await navigator.clipboard.writeText(text); el.textContent = "Kopioitu"; }
  catch { el.textContent = "Kopiointi ei onnistunut"; }
}

function render(d) {
  const kinds = [...new Set(d.signals.map(s => SIGNAL[s.kind] || s.kind))];
  let h = "";
  if (kinds.length || d.crisis?.havaittu) {
    h += `<div class="banner">Huomio: mahdollinen kriisisignaali${kinds.length ? " (" + esc(kinds.join(", ")) + ")" : ""}
      <span>${esc(d.crisis?.kuvaus || "Arvioi tilanne ja tarvittaessa ohjaa kiireelliseen apuun.")}</span></div>`;
  }
  h += (d.followup ? `<span class="tag">jatkokysymys</span>` : "") +
    d.topics.map(t => `<span class="tag">${esc(t)}</span>`).join("") + `<span class="tag">kysyjä: ${esc(d.asker)}</span>`;

  if (d.mode === "luonnos") {
    const checks = d.draft.match(/\[TARKISTA:[^\]]*\]/g) || [];
    h += `<h3>Vastausluonnos</h3><textarea id="draft">${esc(d.draft)}</textarea>
      <div class="row"><button id="copyDraft">Kopioi luonnos</button><span class="hint" id="copyDraftMsg"></span>
      ${checks.length ? `<span class="hint">· ${checks.length} [TARKISTA]-kohtaa poistettava ennen lähetystä</span>` : ""}</div>`;
    h += `<h3>Tarkastajan huomiot</h3>`;
    h += d.issues.length ? d.issues.map(i => `<div class="issue ${esc(i.vakavuus)}"><strong>${esc(i.vakavuus || "")}</strong> · ${esc(i.kuvaus)}
        ${i.kohta ? `<br><q>${esc(i.kohta)}</q>` : ""}${i.ehdotus ? `<br>Ehdotus: ${esc(i.ehdotus)}` : ""}</div>`).join("")
      : `<p class="hint">Tarkastaja ei löytänyt korjattavaa.</p>`;
  }

  if (d.research && d.research.length) {
    h += `<h3>Tutkimuslähteet</h3><p class="hint">Hakulause: ${esc(d.research_query)} · tarkista väitteet tarvittaessa alkuperäisestä</p>`;
    h += d.research.map(r => `<div class="link" style="grid-template-columns:1fr">
      <div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
      <div class="meta" style="grid-column:1">${esc(r.authors)} · ${esc(r.journal)} ${esc(r.year)}${r.review ? " · katsaus" : ""}
        ${r.used ? ` · <strong>käytetty luonnoksessa</strong>${r.kaytto ? ": " + esc(r.kaytto) : ""}` : " · ei käytetty"}</div>
      ${r.abstract ? `<details style="margin-top:4px;grid-column:1"><summary>Tiivistelmä</summary><p class="hint">${esc(r.abstract)}…</p></details>` : ""}
    </div>`).join("");
  } else if (d.research_query) {
    h += `<h3>Tutkimuslähteet</h3><p class="hint">Ei osumia hakulauseella: ${esc(d.research_query)}</p>`;
  }
  h += `<h3>${d.mode === "luonnos" ? "Luonnoksen linkit" : "Linkkiehdotukset"}</h3>`;
  if (!d.links.length) h += `<p class="hint">Katalogista ei löytynyt sopivaa sisältöä.</p>`;
  d.links.forEach((l, i) => {
    h += `<label class="link ${l.type === "kriisi" ? "kriisi" : ""}">
      <input type="checkbox" checked data-i="${i}">
      <div><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></div>
      <div class="meta">${esc(l.reason)}${l.checker_note ? " · Tarkastaja: " + esc(l.checker_note) : ""}</div>
      <div class="meta">${esc(l.type)} · ${esc(SOURCE[l.source] || l.source)}</div>
    </label>`;
  });
  h += `<div class="row"><button class="ghost" id="copyLinks">Kopioi valitut linkit</button><span class="hint" id="copyLinksMsg"></span></div>`;
  if (d.outline.length) h += `<h3>Ehdotettu runko</h3><ol>${d.outline.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
  if (d.notes.length) h += `<h3>Muut huomiot</h3><ul>${d.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (d.rejected.length) h += `<details><summary>Tarkastajan hylkäämät linkit (${d.rejected.length})</summary><ul>${
      d.rejected.map(x => `<li>${esc(x.id)}: ${esc(x.syy)}</li>`).join("")}</ul></details>`;
  const counts = Object.entries(d.pseudonym_counts).map(([k, v]) => `${k} ${v}`).join(", ") || "ei korvauksia";
  h += `<details><summary>Mallille lähtenyt teksti (${esc(counts)})</summary><pre>${esc(d.pseudonymized_question)}</pre></details>`;
  if (d.mode === "luonnos") {
    const own = d.examples_used.filter(e => e.oma).length;
    h += `<details><summary>Luonnoksen pohjana</summary><p class="hint">Lähdeotteet: ${esc(d.sources_used.join(", ") || "–")}<br>
      Esimerkkivastauksia: ${d.examples_used.length}${own ? ` (omia ${own})` : ""}</p></details>`;
  }
  h += `<footer>${esc(d.models.provider)} · ${d.timings_ms.tutkimushaku ? `tutkimushaku ${(d.timings_ms.tutkimushaku / 1000).toFixed(1)} s · ` : ""}luonnostelija ${(d.timings_ms.luonnostelija / 1000).toFixed(1)} s · tarkastaja ${(d.timings_ms.tarkastaja / 1000).toFixed(1)} s</footer>`;
  $("#out").innerHTML = h;
  if ($("#copyDraft")) $("#copyDraft").onclick = () => copy($("#draft").value, $("#copyDraftMsg"));
  $("#copyLinks").onclick = () => {
    const sel = [...document.querySelectorAll(".link input:checked")].map(c => d.links[+c.dataset.i]);
    copy(sel.map(l => `${l.title}: ${l.url}`).join("\n"), $("#copyLinksMsg"));
  };
}
$("#thread").addEventListener("input", () => {
  const on = $("#thread").value.trim().length > 0;
  $("#qTitle").textContent = on ? "Jatkokysymys" : "Kysymys";
});
$("#go").onclick = run;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
</script>
</body>
</html>
